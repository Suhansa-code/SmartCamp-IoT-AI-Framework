name: Auto PR from dev branches to main

on:
  push:
    branches:
      - "*-dev"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry-platform/backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: raspberry-platform/backend/package-lock.json

      - run: npm ci
      - run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberry-platform/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: raspberry-platform/frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test

  create-pull-request:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: auto-pr-${{ github.ref_name }}
          title: "Auto PR: ${{ github.ref_name }} → main"
          body: |
            This PR was automatically created from ${{ github.ref_name }} branch.

            ## Test Results
            - ✅ Backend: Unit + Integration tests pass
            - ✅ Frontend: Component tests pass (Playwright E2E in progress)
          labels: automated