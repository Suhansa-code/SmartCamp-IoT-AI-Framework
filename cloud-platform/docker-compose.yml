# SmartCamp cloud stack (AWS EC2, x86-64).
#
# Build the frontend on a workstation and ship the image; `next build` spawns a
# worker per CPU and will not survive a 1 GB t3.micro. The backend is small
# enough to build in place.
#
#   docker compose build
#   docker compose up -d
services:
  backend:
    build:
      # Context is the cloud-platform root so the image can reach
      # prediction-models/models — see backend/Dockerfile.
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    # No DB_HOST override here: whatever backend/.env sets now wins. With a
    # managed database (Neon et al.) set DATABASE_URL in .env — config/env.js
    # prefers it over the DB_* values and database.js uses it verbatim, so the
    # host-gateway entry below simply goes unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `ping` needs raw sockets. Without NET_RAW the exec fails and the network
    # domain reads a permanently dead uplink rather than the real one.
    cap_add:
      - NET_RAW
    # No published port: nginx is the only public entrypoint. Uncomment to
    # expose the API directly for debugging (also needs the SG rule back).
    expose:
      - "3001"
    volumes:
      # alerts.db is SQLite on disk and *.db is gitignored — without this the
      # education domain's synced alerts vanish on every recreate.
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time. Point it at the public
        # address the *browser* will use, never at localhost or a private IP.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        # Falls back to NEXT_PUBLIC_API_URL inside the Dockerfile when unset.
        NEXT_PUBLIC_DISASTER_API_BASE_URL: ${NEXT_PUBLIC_DISASTER_API_BASE_URL:-}
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      - backend

  # Single public entrypoint on :80 so visitors never type a port number, and
  # so the frontend and API share an origin — which is what lets
  # NEXT_PUBLIC_API_URL drop the :3001 suffix and makes CORS irrelevant.
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:
