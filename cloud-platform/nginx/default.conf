# Single public entrypoint for the cloud stack.
#
# Putting both services behind one origin is what lets NEXT_PUBLIC_API_URL be
# the bare host with no port: the frontend's fetches to `${API}/api/...` land
# here and get routed to the backend, so browsers never talk to :3001 directly
# and CORS never enters the picture.
upstream frontend { server frontend:3000; }
upstream backend  { server backend:3001;  }

server {
    listen 80;
    server_name _;

    # Camp payloads (bulk registration mirrors) exceed nginx's 1 MB default.
    client_max_body_size 10m;

    # The API is mounted at /api by the Express app, so this prefix is the
    # whole backend surface — it must come before the catch-all below.
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Network metrics poll on an interval; a short read timeout would cut
        # long-poll style requests off mid-flight.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Next dev/HMR and any future streaming responses need upgrade support.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
