# Optional overlay: hand the ESP32 Sensor_Bridge (GPS + DHT11 over one USB
# serial link) through to the container.
#
#   docker compose -f docker-compose.yml -f docker-compose.sensors.yml up -d --build
#
# Kept out of the base file because compose refuses to START a service whose
# device path does not exist — naming it there makes the stack undeployable on
# any host without the bridge plugged in, which is the common case on the Pi.
#
# Find the device with:  ls -l /dev/serial/by-id/
# Do NOT put a /dev/serial/by-id/... path in GPS_SERIAL_PORT: compose's short
# device syntax splits on ':' and those names can contain one.
services:
  edge-gateway:
    devices:
      - "${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}:${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}"
