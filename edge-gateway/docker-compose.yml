# Edge Gateway stack. Runs on the Raspberry Pi (linux/arm64) alongside the
# camp backend, or on a NUC — the image builds on both.
#
#   docker compose up -d --build                    # ESP32 bridge attached via GPS_SERIAL_PORT
#
# A .env IS required (fail-first): GPS_SERIAL_PORT and GPS_BAUDRATE must be
# defined or compose aborts. Copy .env.example to .env and adjust.
#
# The Pi's backend reaches this over the camp LAN, so EDGE_API_URL in
# raspberry-platform/backend/.env must be http://<this-host>:8000 — its
# default of 127.0.0.1 resolves to the backend's own container.
services:
  edge-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional: compose still starts with no .env for the OPTIONAL values,
    # but GPS_SERIAL_PORT / GPS_BAUDRATE below abort the run if missing.
    env_file:
      - path: .env
        required: false
    devices:
      - "${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}:${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}"

    environment:
      # sensor_state.py opens this port ONCE at startup and owns it for the
      # process lifetime; every endpoint reads its in-memory cache.
      # No defaults (fail-first): :? aborts compose if unset, and the app
      # crashes at import if the vars are missing inside the container.
      GPS_PORT: ${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}
      GPS_BAUDRATE: ${GPS_BAUDRATE:?GPS_BAUDRATE is not set in .env}
      # The rainfall ESP32 posts over WiFi instead of serial, so its
      # freshness is decided by a timeout rather than by the port state.
      RAINFALL_WIRELESS_TIMEOUT_SECONDS: ${RAINFALL_WIRELESS_TIMEOUT_SECONDS:-30}
    # Published on all interfaces on purpose: the Pi backend polls it and the
    # wireless rainfall ESP32 POSTs to /api/rainfall. Bound to localhost it
    # would leave GPS, DHT11, rainfall and weather silently empty on the Pi.
    ports:
      - "${EDGE_PORT:-8000}:8000"
    # ESP32 Sensor_Bridge (GPS + DHT11 + serial rainfall over one USB link).
    # Find the device with:  ls -l /dev/serial/by-id/
    # Do NOT put a /dev/serial/by-id/... path in GPS_SERIAL_PORT: compose's
    # short device syntax splits on ':' and those names can contain one.
    # Compose refuses to START if this path is missing, so the bridge must be
    # plugged in. sensor_state.py still opens the port with retry backoff, so a
    # transient unplug only reports GPS/DHT11 disconnected.
    devices:
      - "${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}:${GPS_SERIAL_PORT:?GPS_SERIAL_PORT is not set in .env}"
    # The local DEM raster is NOT in the image: digital_elevation_algorithm.py
    # hardcodes a Windows .img path (line 7), so /hydrospatial/elevation always
    # answers from the Open-Elevation API here. To serve it from the raster,
    # make that path configurable and mount the file, e.g.
    #   volumes:
    #     - ${DEM_FILE:-./resources/dem.img}:/app/resources/dem.img:ro
    # /dev/ttyUSB* is root:dialout 0660 and the image runs as the unprivileged
    # `gateway` user, so the process must join gid 20 (dialout) to open it.
    group_add:
      - "${DIALOUT_GID:-20}"
    restart: unless-stopped
