# Raspberry Pi stack. Build on the Pi itself (linux/arm64).
#
#   docker compose up -d --build
#
# Note the network-monitor is what makes SAAMP's adaptive QoS live at all:
# without it the backend's predicted state falls back to whatever the broker
# connection reports, and the model plays no part.
services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    env_file: .env
    environment:
      # Compose DNS resolves this service name. Native npm start uses localhost.
      CLOUD_ML_URL: http://python-service:5001
    ports:
      - "5000:5000"
    # camp.db / pages.db / disaster.db live here. WITHOUT this bind mount they
    # are written inside the container, so `up -d --build` silently discards
    # every registration, distribution and buffered SAAMP message. The schema
    # .sql files ship in the same directory and are re-applied idempotently at
    # boot, so a fresh clone starts empty and correct.
    volumes:
      - ./db:/usr/src/app/db
    restart: unless-stopped
    depends_on:
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  python-service:
    build:
      context: .
      dockerfile: python/Dockerfile
    env_file: .env
    expose:
      - "5001"
    # Flask persists per-child .pkl models and session_history.json; without
    # these mounts every restart discards what it has learned.
    volumes:
      - ./python/models:/app/models
      - ./python/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  network-monitor:
    build:
      context: ../prediction-models
      dockerfile: Dockerfile
    # EMQX_HOST/EMQX_PORT come from .env so the broker probe targets the same
    # broker the backend publishes to.
    env_file: .env
    # Host networking is load-bearing: on the default bridge, ping measures the
    # NAT path rather than the camp uplink, so the model reads a link that
    # isn't the one SAAMP publishes over. NET_RAW is what lets ping run at all.
    network_mode: host
    cap_add:
      - NET_RAW
    # With host networking there is no compose DNS — the backend is reached via
    # its published port on the host.
    command: >
      python -u scripts/network_monitor_service.py
      --backend http://localhost:5000
      --interval 30
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend-service:
    build:
      context: ../frontend
      dockerfile: dockerfile
      args:
        # Baked into the JS bundle at build time. Left as localhost, every
        # tablet on the camp network calls ITS OWN localhost and the UI is
        # dead on arrival. Set PI_HOST in .env to the Pi's LAN address.
        VITE_API_URL: http://${PI_HOST:-localhost}:5000
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
